name: Deploy demo estatica a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_MODE: export
      NEXT_PUBLIC_BASE_PATH: /moneya
      # Si los Secrets no existen, GitHub los reemplaza por string vacío → build en
      # modo demo (igual que hoy). Cuando agregues SUPABASE_URL/SUPABASE_ANON_KEY en
      # Settings → Secrets and variables → Actions, el próximo push sale con login real.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # El runtime de sqlite-wasm se sirve fuera del bundle: si no llega a out/,
      # la app cae al respaldo localStorage en silencio (kvvfs nunca activo).
      - run: npm run sqlite:out
      - name: Verifica el runtime de sqlite en el artefacto
        run: |
          set -e
          for f in index.mjs sqlite3-worker1.mjs sqlite3.wasm; do
            test -f "out/sqlite/$f" || { echo "FALTA out/sqlite/$f"; exit 1; }
          done
          echo "OK: runtime de sqlite presente en out/sqlite/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Higiene (AGENTS §11): no bloquea el deploy de la demo; sirve de señal
  # visible en Actions. Escaneo de secretos en-repo + audit de dependencias.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sh scripts/scan-secrets.sh
      # Advisories conocidos en devDependencies (tooling de Tailwind 3.4:
      # braces/fast-glob/micromatch/chokidar/postcss-selector-parser).
      # Solo se resuelven con Tailwind 4 (breaking); ver SECURITY_REVIEW.md §8.
      # El paso falla y queda visible, pero no enrojece la run del deploy.
      - run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Puerta de calidad visual: mide el sitio ya desplegado en un navegador real
  # (contraste WCAG, nombres accesibles, bordes de control, jerarquia de
  # encabezados). Si falla, el workflow queda en rojo como senal visible; el
  # deploy ya ocurrio, asi que no se revierte nada.
  auditoria-visual:
    name: Auditoria visual (contraste y accesibilidad)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resuelve la URL publica y espera a que Pages responda
        run: |
          set -e
          BASE="${{ needs.deploy.outputs.page_url }}"
          case "$BASE" in
            */moneya) ;;
            *) BASE="$BASE/moneya" ;;
          esac
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/" || true)
            if [ "$code" = "200" ]; then
              echo "Pages responde 200 en $BASE"
              exit 0
            fi
            echo "intento $i: HTTP $code, reintentando"
            sleep 15
          done
          echo "Pages no respondio 200 en $BASE"
          exit 1
      - name: Auditoria visual (movil y escritorio, claro y oscuro)
        run: npm run auditar:visual -- --url "$BASE" --tema claro,oscuro --ancho 390,1280 --fallo
