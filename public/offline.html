<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F1E1D" />
    <title>Sin conexión — MONEYA</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #faf9f5;
        color: #1f1e1d;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.75rem;
        color: #8a7f74;
      }
      h1 {
        margin: 0.5rem 0 0.75rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        color: #57534e;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        background: #1f1e1d;
        color: #faf9f5;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">MONEYA</p>
      <h1>Estás sin conexión</h1>
      <p>
        No pudimos cargar esta pantalla porque no hay red. Los cálculos de MONEYA corren en tu
        navegador, así que puedes reintentar cuando recuperes conexión.
      </p>
      <a href="./">Reintentar</a>
    </main>
  </body>
</html>
